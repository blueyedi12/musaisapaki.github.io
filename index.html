<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Musa (@musaisapaki) • Link Tree</title>

  <meta name="theme-color" content="#07070a">
  <meta name="description" content="Official links and social profiles for Musa (@musaisapaki)">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Font Awesome Icons CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Inter Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          animation: {
            'spin-slow': 'spin 12s linear infinite',
            'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
          }
        }
      }
    }
  </script>

  <style>
    :root {
      --bg: #07070a;
      --card-bg: rgba(255, 255, 255, 0.03);
      --card-border: rgba(255, 255, 255, 0.08);
      --text: #ffffff;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
    }

    /* Ambient Cursor Glow */
    #cursor-glow {
      position: fixed;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(79, 70, 229, 0.14) 0%, rgba(49, 46, 129, 0.06) 45%, rgba(0, 0, 0, 0) 70%);
      pointer-events: none;
      transform: translate(-50%, -50%);
      transition: width 0.3s, height 0.3s, opacity 0.3s;
      z-index: 1;
    }

    /* Glassmorphism Styling */
    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
    }

    /* Animated Conic Ring for Avatar */
    .avatar-ring {
      background: conic-gradient(
        from 0deg,
        #4f46e5,
        #312e81,
        #1e1b4b,
        #6366f1,
        #4f46e5
      );
    }

    /* Shine effect for interactive link cards */
    .shine-effect {
      position: relative;
      overflow: hidden;
    }

    .shine-effect::before {
      content: '';
      position: absolute;
      top: 0;
      left: -150%;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 255, 255, 0.08),
        transparent
      );
      transform: skewX(-25deg);
      transition: left 0.75s ease;
    }

    .shine-effect:hover::before {
      left: 150%;
    }

    /* Link Hover Styles with Platform Themes */
    .link-card {
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      transform-style: preserve-3d;
    }

    .link-card[data-platform="instagram"]:hover {
      border-color: rgba(225, 48, 108, 0.4);
      box-shadow: 0 10px 30px -5px rgba(225, 48, 108, 0.2);
      background: linear-gradient(135deg, rgba(225, 48, 108, 0.08) 0%, rgba(255, 255, 255, 0.02) 100%);
    }

    .link-card[data-platform="tiktok"]:hover {
      border-color: rgba(0, 242, 254, 0.4);
      box-shadow: 0 10px 30px -5px rgba(0, 242, 254, 0.18);
      background: linear-gradient(135deg, rgba(0, 242, 254, 0.08) 0%, rgba(255, 0, 80, 0.06) 100%);
    }

    .link-card[data-platform="snapchat"]:hover {
      border-color: rgba(255, 252, 0, 0.4);
      box-shadow: 0 10px 30px -5px rgba(255, 252, 0, 0.18);
      background: linear-gradient(135deg, rgba(255, 252, 0, 0.08) 0%, rgba(255, 255, 255, 0.02) 100%);
    }

    .link-card[data-platform="youtube"]:hover {
      border-color: rgba(255, 0, 0, 0.4);
      box-shadow: 0 10px 30px -5px rgba(255, 0, 0, 0.2);
      background: linear-gradient(135deg, rgba(255, 0, 0, 0.08) 0%, rgba(255, 255, 255, 0.02) 100%);
    }
  </style>
</head>

<body class="min-h-screen flex flex-col justify-between items-center py-10 px-4 relative select-none">

    <!-- Social Links Section -->
    <section class="w-full flex flex-col gap-3.5" id="links-container">

      <!-- 1. Instagram Link -->

            <i class="fa-brands fa-tiktok text-xl text-cyan-400 drop-shadow-[2px_0_0_rgba(255,0,80,0.8)]"></i>
          </div>

        </div>
        <div class="w-8 h-8 rounded-full flex items-center justify-center text-zinc-500 group-hover:text-cyan-400 group-hover:translate-x-1 group-hover:-translate-y-0.5 transition-all duration-300">
          <i class="fa-solid fa-arrow-up-right-from-square text-xs"></i>
        </div>
      </a>

      <!-- 3. Snapchat Link -->
      <a href="https://www.snapchat.com/add/musaisapaki?share_id=CIl9aGCcRcupm5jEYggMNw&locale=en_CA" target="_blank" rel="noopener noreferrer" 
         data-platform="snapchat"
         class="link-card shine-effect glass-card w-full h-[64px] rounded-2xl px-4 flex items-center justify-between group cursor-pointer border border-white/10">
        <div class="flex items-center gap-3.5">

          </div>

        </div>
        <div class="w-8 h-8 rounded-full flex items-center justify-center text-zinc-500 group-hover:text-yellow-400 group-hover:translate-x-1 group-hover:-translate-y-0.5 transition-all duration-300">
          <i class="fa-solid fa-arrow-up-right-from-square text-xs"></i>
        </div>
      </a>

      <!-- 4. YouTube Link -->
      <a href="https://www.youtube.com/@musaisapaki" target="_blank" rel="noopener noreferrer" 
         data-platform="youtube"
         class="link-card shine-effect glass-card w-full h-[64px] rounded-2xl px-4 flex items-center justify-between group cursor-pointer border border-white/10">
        <div class="flex items-center gap-3.5">
          <div class="w-10 h-10 rounded-xl bg-red-600 flex items-center justify-center text-white shadow-md group-hover:scale-110 transition-transform duration-300">
            <i class="fa-brands fa-youtube text-xl"></i>
          </div>
          <span class="text-sm font-semibold text-zinc-100 group-hover:text-white transition-colors">YouTube</span>
        </div>
        <div class="w-8 h-8 rounded-full flex items-center justify-center text-zinc-500 group-hover:text-red-500 group-hover:translate-x-1 group-hover:-translate-y-0.5 transition-all duration-300">
          <i class="fa-solid fa-arrow-up-right-from-square text-xs"></i>

    </section>

    <!-- Embedded YouTube Section -->
    <section class="w-full mt-6 flex flex-col gap-3">
      <div class="flex items-center justify-between px-1">
        <span class="text-xs font-bold uppercase tracking-wider text-zinc-400 flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></span>
          Latest Video
        </span>
        <a href="https://www.youtube.com/@musaisapaki" target="_blank" rel="noopener noreferrer" class="text-xs text-zinc-400 hover:text-red-400 transition-colors flex items-center gap-1 font-medium">
          Watch on YouTube <i class="fa-solid fa-chevron-right text-[10px]"></i>

      </div>

      <!-- Video Player Glass Card -->
      <div class="glass-card w-full rounded-2xl p-2.5 border border-white/10 group hover:border-red-500/30 hover:shadow-[0_10px_30px_-5px_rgba(255,0,0,0.15)] transition-all duration-300">
        <div class="relative w-full aspect-video rounded-xl overflow-hidden bg-zinc-950 flex flex-col items-center justify-center border border-white/5">
          
          <!-- Iframe Player (Embedded reliable YouTube video player) -->
          <iframe

            src="https://www.youtube-nocookie.com/embed/videoseries?list=UUWQRswUdIkqT48iiJCdT8Ig"

            <a href="https://www.youtube.com/@musaisapaki" target="_blank" rel="noopener noreferrer" 
               class="px-4 py-2 rounded-xl bg-red-600 hover:bg-red-500 text-white text-xs font-bold transition-all shadow-lg shadow-red-600/30 flex items-center gap-2">

            </a>

        </div>
      </div>
    </section>

    <!-- Footer -->
    <footer class="mt-10 text-center flex flex-col items-center gap-3">
      <div class="flex items-center gap-4 text-zinc-500 text-base">
        <a href="https://www.instagram.com/musaisapaki/" target="_blank" rel="noopener noreferrer" class="hover:text-pink-400 transition-colors"><i class="fa-brands fa-instagram"></i></a>
        <a href="https://www.tiktok.com/@musaisapaki" target="_blank" rel="noopener noreferrer" class="hover:text-cyan-400 transition-colors"><i class="fa-brands fa-tiktok"></i></a>
        <a href="https://www.snapchat.com/add/musaisapaki?share_id=CIl9aGCcRcupm5jEYggMNw&locale=en_CA" target="_blank" rel="noopener noreferrer" class="hover:text-yellow-400 transition-colors"><i class="fa-brands fa-snapchat"></i></a>
        <a href="https://www.youtube.com/@musaisapaki" target="_blank" rel="noopener noreferrer" class="hover:text-red-500 transition-colors"><i class="fa-brands fa-youtube"></i></a>

  </main>

  <script>
    // Set Current Year
    document.getElementById('year').textContent = new Date().getFullYear();

    // Fallback banner trigger handler
    function showFallbackBanner() {
      const fallback = document.getElementById('yt-fallback');
      if (fallback) fallback.classList.remove('hidden');
    }

    // Ambient Cursor Glow Follower
    const cursorGlow = document.getElementById('cursor-glow');
    let mouseX = window.innerWidth / 2;
    let mouseY = window.innerHeight / 2;
    let glowX = mouseX;
    let glowY = mouseY;

    window.addEventListener('mousemove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
    });

    window.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) {
        mouseX = e.touches[0].clientX;
        mouseY = e.touches[0].clientY;
      }
    });

    function animateGlow() {
      glowX += (mouseX - glowX) * 0.08;
      glowY += (mouseY - glowY) * 0.08;
      cursorGlow.style.left = `${glowX}px`;
      cursorGlow.style.top = `${glowY}px`;
      requestAnimationFrame(animateGlow);
    }
    animateGlow();

    // Canvas Floating Particles Background
    const canvas = document.getElementById('particle-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor() {
        this.reset();
      }

      reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 1.8 + 0.4;
        this.vx = (Math.random() - 0.5) * 0.25;
        this.vy = (Math.random() - 0.5) * 0.25;
        this.alpha = Math.random() * 0.4 + 0.1;
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;

        if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
          this.reset();
        }
      }

      draw() {
        ctx.fillStyle = `rgba(99, 102, 241, ${this.alpha})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    for (let i = 0; i < 45; i++) {
      particles.push(new Particle());
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.update();
        p.draw();
      });
      requestAnimationFrame(animateParticles);
    }
    animateParticles();

    // 3D Card Tilt Effect on Hover
    const linkCards = document.querySelectorAll('.link-card');
    linkCards.forEach(card => {
      card.addEventListener('mousemove', (e) => {
        const rect = card.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const centerX = rect.width / 2;
        const centerY = rect.height / 2;
        const rotateX = (y - centerY) / 12;
        const rotateY = (centerX - x) / 12;

        card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.02, 1.02, 1.02)`;
      });

      card.addEventListener('mouseleave', () => {
        card.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)';
      });
    });
  </script>
</body>
</html>
