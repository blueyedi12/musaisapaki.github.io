<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Musa</title>
  <meta name="theme-color" content="#07070a">
  <meta name="description" content="Musa's social links and latest content">

  <style>
    :root {
      --bg: #07070a;
      --card-bg: rgba(255, 255, 255, 0.035);
      --card-border: rgba(255, 255, 255, 0.08);
      --text: #ffffff;
      --muted: #94a3b8;
      --accent-1: #4f46e5;
      --accent-2: #312e81;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      color: var(--text);
      background: var(--bg);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 18px;
      overflow-x: hidden;
      position: relative;
    }

    /* Ambient background glows */
    body::before {
      content: "";
      position: fixed;
      width: 380px;
      height: 380px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(79, 70, 229, 0.15) 0%, transparent 70%);
      top: -100px;
      left: 50%;
      transform: translateX(-50%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      width: 100%;
      max-width: 420px;
      text-align: center;
      position: relative;
      z-index: 2;
    }

    /* Profile Section */
    .profile {
      margin-bottom: 28px;
    }

    .profile-wrapper {
      width: 100px;
      height: 100px;
      margin: 0 auto 16px;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .profile-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: conic-gradient(from 180deg, var(--accent-1), var(--accent-2), var(--accent-1));
      animation: rotate 10s linear infinite;
    }

    .profile-ring::after {
      content: "";
      position: absolute;
      inset: 2px;
      border-radius: 50%;
      background: var(--bg);
    }

    .profile-img {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      background: linear-gradient(145deg, #18181b, #09090b);
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 30px;
      font-weight: 700;
      color: #e2e8f0;
      position: relative;
      z-index: 2;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 4px;
    }

    .handle {
      color: var(--muted);
      font-size: 0.95rem;
      font-weight: 400;
    }

    /* Links Section */
    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 30px;
    }

    .link-card {
      min-height: 62px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      color: var(--text);
      text-decoration: none;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease;
    }

    .link-card:hover {
      transform: translateY(-2px);
      background: rgba(255, 255, 255, 0.07);
      border-color: rgba(79, 70, 229, 0.4);
    }

    .link-card:active {
      transform: scale(0.98);
    }

    .link-info {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .icon {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: rgba(255, 255, 255, 0.05);
    }

    .icon svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .link-name {
      font-size: 0.96rem;
      font-weight: 600;
    }

    .arrow {
      color: #64748b;
      font-size: 1.1rem;
      transition: transform 0.2s ease, color 0.2s ease;
    }

    .link-card:hover .arrow {
      color: #a5b4fc;
      transform: translate(2px, -2px);
    }

    /* Video Section */
    .video-section {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 16px;
      text-align: left;
    }

    .video-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .video-title {
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      background: #ef4444;
      border-radius: 50%;
      box-shadow: 0 0 8px rgba(239, 68, 68, 0.6);
    }

    .video-yt-link {
      color: var(--muted);
      font-size: 0.82rem;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s ease;
    }

    .video-yt-link:hover {
      color: #fff;
    }

    .video-container {
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
      position: relative;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }

    .video-container iframe,
    .video-container .video-facade {
      width: 100%;
      height: 100%;
      border: 0;
      position: absolute;
      top: 0;
      left: 0;
    }

    /* Lazy Play Button Facade */
    .video-facade {
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #18181b, #09090b);
      cursor: pointer;
      z-index: 2;
    }

    .play-btn {
      width: 54px;
      height: 54px;
      background: rgba(239, 68, 68, 0.9);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 20px rgba(239, 68, 68, 0.4);
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .play-btn svg {
      width: 20px;
      height: 20px;
      fill: #ffffff;
      margin-left: 3px;
    }

    .video-facade:hover .play-btn {
      transform: scale(1.1);
      background: #ef4444;
    }

    @keyframes rotate {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 480px) {
      body { padding: 30px 14px; }
      .container { max-width: 100%; }
    }
  </style>
</head>
<body>

    </section>

    <!-- Latest Video Embed -->
    <section class="video-section">
      <div class="video-header">
        <span class="video-title"><span class="pulse-dot"></span> Latest Video</span>
        <a href="https://www.youtube.com/@musaisapaki" target="_blank" class="video-yt-link">Watch on YouTube &rsaquo;</a>
      </div>
      <div class="video-container" id="videoContainer">
        <div class="video-facade" onclick="loadVideo()">
          <div class="play-btn">
            <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          </div>
        </div>
      </div>
    </section>

  </main>

  <script>
    function loadVideo() {
      const container = document.getElementById('videoContainer');
      container.innerHTML = `<iframe 
        src="https://www.youtube-nocookie.com/embed/videoseries?list=UUWQRswUdIkqT48iiJCdT8Ig&autoplay=1" 
        title="Latest YouTube Video" 
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
        allowfullscreen>
      </iframe>`;
    }
  </script>
</body>
</html>
