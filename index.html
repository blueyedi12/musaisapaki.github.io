    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {

    <style>
        body {
            background-color: #070709;
            color: #f3f4f6;
            overflow-x: hidden;
        }

        /* Glassmorphism Styles */
        .glass-card {
            background: rgba(18, 18, 26, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);

        }

        .glass-card:hover {
            border-color: rgba(255, 255, 255, 0.18);
        }

        /* Instagram Glow & Button */
        .insta-btn {
            background: linear-gradient(135deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            box-shadow: 0 4px 25px rgba(220, 39, 67, 0.4);
        }
        .insta-btn:hover {
            box-shadow: 0 6px 35px rgba(220, 39, 67, 0.7);
            transform: translateY(-2px);
        }
        .insta-glow {
            box-shadow: 0 0 80px rgba(220, 39, 67, 0.25);
        }

        /* TikTok Neon Effect */
        .tiktok-btn {
            background: #000000;
            border: 1px solid rgba(0, 242, 254, 0.4);
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.2), inset 0 0 10px rgba(255, 0, 80, 0.2);
        }
        .tiktok-btn:hover {
            box-shadow: -3px 3px 25px rgba(255, 0, 80, 0.6), 3px -3px 25px rgba(0, 242, 254, 0.6);
            transform: translateY(-2px);
        }
        .tiktok-glow {
            box-shadow: 0 0 80px rgba(0, 242, 254, 0.2);
        }

        /* Snapchat Glow */
        .snap-btn {
            background: #FFFC00;
            color: #000;
            font-weight: 700;
            box-shadow: 0 4px 25px rgba(255, 252, 0, 0.35);
        }
        .snap-btn:hover {
            box-shadow: 0 6px 35px rgba(255, 252, 0, 0.6);
            transform: translateY(-2px);
        }
        .snap-glow {
            box-shadow: 0 0 80px rgba(255, 252, 0, 0.15);
        }

        /* YouTube Glow */
        .yt-btn {
            background: #FF0000;
            box-shadow: 0 4px 25px rgba(255, 0, 0, 0.4);
        }
        .yt-btn:hover {
            box-shadow: 0 6px 35px rgba(255, 0, 0, 0.7);
            transform: translateY(-2px);
        }
        .yt-glow {
            box-shadow: 0 0 90px rgba(255, 0, 0, 0.25);
        }

        /* Custom Curved Text Styles */
        .curved-text-path {
            font-family: 'Syne', sans-serif;
            font-weight: 800;
            fill: url(#text-gradient);
            letter-spacing: 4px;
            text-transform: lowercase;
        }

        /* Animations */
        .reveal-element {
            opacity: 0;
            transition: all 0.9s cubic-bezier(0.16, 1, 0.3, 1);
            will-change: transform, opacity;
        }

        .reveal-left {
            transform: translateX(-70px);
        }

        .reveal-right {
            transform: translateX(70px);
        }

        .reveal-up {
            transform: translateY(60px);
        }

        .reveal-element.active {
            opacity: 1;
            transform: translate(0, 0);
        }

        /* Snap Scroll Container setup */
        .scroll-container {
            scroll-snap-type: y mandatory;
        }
        
        .section-snap {
            scroll-snap-align: start;
            scroll-snap-stop: always;
        }

        /* Floating background lights */
        .ambient-light {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            pointer-events: none;
            z-index: 0;
        }
    </style>
</head>
<body class="font-sans antialiased text-gray-100 selection:bg-purple-600 selection:text-white">

    <!-- Ambient Background Lighting -->

    <!-- Footer -->
    <footer class="w-full py-8 text-center text-xs text-gray-600 border-t border-gray-900 bg-obsidian">

    </footer>

    <!-- Scroll Reveal JavaScript Animation Handler -->
    <script>
        document.getElementById('year').textContent = new Date().getFullYear();

        // Intersection Observer for Smooth Scroll Animations
        document.addEventListener('DOMContentLoaded', () => {
            const observerOptions = {
                root: null,
                rootMargin: '0px',
                threshold: 0.25 // Triggers when 25% of element is visible
            };

            const revealObserver = new IntersectionObserver((entries, observer) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('active');
                    }
                });
            }, observerOptions);

            // Observe all reveal elements
            const revealElements = document.querySelectorAll('.reveal-element');
            revealElements.forEach(el => revealObserver.observe(el));
        });
    </script>

</html>
