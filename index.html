<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>@musaisapaki | Links</title>

  <meta name="theme-color" content="#08080b">
  <meta name="description" content="Musa's social links">

  <style>
    :root {
      --bg: #07070a;
      --card: rgba(255, 255, 255, 0.055);
      --card-hover: rgba(255, 255, 255, 0.09);
      --text: #ffffff;
      --muted: #a1a1aa;
      --border: rgba(255, 255, 255, 0.09);
      --accent: #ff6ec7;
      --accent-2: #8b5cf6;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(
          circle at 50% -10%,
          rgba(255, 110, 199, 0.18),
          transparent 38%
        ),
        radial-gradient(
          circle at 0% 50%,
          rgba(139, 92, 246, 0.08),
          transparent 35%
        ),
        radial-gradient(
          circle at 100% 80%,
          rgba(255, 110, 199, 0.06),
          transparent 30%
        ),
        var(--bg);

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 40px 20px;
      overflow-x: hidden;
      position: relative;
    }

    /* Background glow */
    body::before {
      content: "";
      position: fixed;
      width: 420px;
      height: 420px;
      border-radius: 50%;
      background: rgba(255, 110, 199, 0.08);
      filter: blur(100px);
      top: -180px;
      left: 50%;
      transform: translateX(-50%);
      pointer-events: none;
    }

    .container {
      width: 100%;
      max-width: 430px;
      text-align: center;
      position: relative;
      z-index: 2;
    }

    /* =========================
       PROFILE
    ========================= */

    .profile {
      animation: fadeUp 0.8s cubic-bezier(.2,.8,.2,1) both;
    }

    .profile-wrapper {
      width: 104px;
      height: 104px;
      margin: 0 auto 18px;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .profile-img {
      width: 92px;
      height: 92px;

      border-radius: 50%;

      display: flex;
      justify-content: center;
      align-items: center;

      font-size: 32px;
      font-weight: 700;

      color: white;

      background:
        linear-gradient(
          145deg,
          rgba(255, 255, 255, 0.12),
          rgba(255, 255, 255, 0.035)
        );

      border: 1px solid rgba(255, 255, 255, 0.14);

      box-shadow:
        0 10px 40px rgba(0, 0, 0, 0.4),
        0 0 35px rgba(255, 110, 199, 0.16);

      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);

      position: relative;
      z-index: 2;
    }

    .profile-ring {
      position: absolute;
      inset: 0;

      border-radius: 50%;

      background: conic-gradient(
        from 180deg,
        var(--accent),
        var(--accent-2),
        var(--accent),
        var(--accent-2),
        var(--accent)
      );

      animation: rotate 7s linear infinite;

      opacity: 0.9;
    }

    .profile-ring::after {
      content: "";
      position: absolute;
      inset: 2px;
      border-radius: 50%;
      background: var(--bg);
    }

    .online-dot {
      position: absolute;
      right: 3px;
      bottom: 7px;

      width: 19px;
      height: 19px;

      border-radius: 50%;

      background: #4ade80;
      border: 4px solid var(--bg);

      z-index: 4;

      box-shadow: 0 0 12px rgba(74, 222, 128, 0.5);
    }

    h1 {
      font-size: 1.45rem;
      font-weight: 700;
      letter-spacing: -0.035em;

      display: inline-flex;
      align-items: center;
      gap: 7px;

      margin-bottom: 5px;
    }

    .handle {
      color: var(--muted);
      font-size: 0.92rem;
      margin-bottom: 30px;
    }

    /* =========================
       LINKS
    ========================= */

    .links {
      display: flex;
      flex-direction: column;
      gap: 13px;
    }

    .link-card {
      min-height: 64px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 15px 18px;

      color: var(--text);
      text-decoration: none;

      background:
        linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.065),
          rgba(255, 255, 255, 0.025)
        );

      border: 1px solid var(--border);
      border-radius: 17px;

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      box-shadow:
        0 8px 25px rgba(0, 0, 0, 0.16);

      position: relative;
      overflow: hidden;

      transform: translateY(18px);
      opacity: 0;

      animation: linkIn 0.65s cubic-bezier(.2,.8,.2,1) forwards;

      transition:
        transform 0.25s cubic-bezier(.2,.8,.2,1),
        background 0.25s ease,
        border-color 0.25s ease,
        box-shadow 0.25s ease;
    }

    .link-card:nth-child(1) {
      animation-delay: 0.15s;
    }

    .link-card:nth-child(2) {
      animation-delay: 0.23s;
    }

    .link-card:nth-child(3) {
      animation-delay: 0.31s;
    }

    /* Shine */
    .link-card::before {
      content: "";

      position: absolute;
      top: 0;
      left: -120%;

      width: 80%;
      height: 100%;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.07),
          transparent
        );

      transform: skewX(-20deg);

      transition: left 0.6s ease;
    }

    .link-card:hover::before {
      left: 140%;
    }

    .link-card:hover {
      transform: translateY(-3px) scale(1.012);

      background:
        linear-gradient(
          135deg,
          rgba(255, 110, 199, 0.11),
          rgba(139, 92, 246, 0.07)
        );

      border-color: rgba(255, 110, 199, 0.35);

      box-shadow:
        0 12px 35px rgba(0, 0, 0, 0.3),
        0 0 25px rgba(255, 110, 199, 0.08);
    }

    .link-card:active {
      transform: scale(0.97);
    }

    .link-info {
      display: flex;
      align-items: center;
      gap: 14px;
      position: relative;
      z-index: 2;
    }

    .icon {
      width: 39px;
      height: 39px;

      border-radius: 12px;

      display: flex;
      justify-content: center;
      align-items: center;

      background: rgba(255, 255, 255, 0.055);
      border: 1px solid rgba(255, 255, 255, 0.07);

      transition:
        transform 0.25s ease,
        background 0.25s ease;
    }

    .icon svg {
      width: 20px;
      height: 20px;

      fill: currentColor;

      transition:
        transform 0.25s ease;
    }

    .link-card:hover .icon {
      transform: scale(1.08);
      background: rgba(255, 110, 199, 0.12);
    }

    .link-card:hover .icon svg {
      transform: scale(1.08);
      color: var(--accent);
    }

    .link-name {
      font-size: 0.96rem;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .arrow {
      color: #71717a;
      font-size: 1.15rem;

      position: relative;
      z-index: 2;

      transition:
        transform 0.25s ease,
        color 0.25s ease;
    }

    .link-card:hover .arrow {
      color: var(--accent);
      transform: translate(3px, -3px);
    }

    /* =========================
       ANIMATIONS
    ========================= */

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(18px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes linkIn {
      from {
        opacity: 0;
        transform: translateY(18px) scale(0.97);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes rotate {
      to {
        transform: rotate(360deg);
      }
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 480px) {
      body {
        padding: 30px 16px;
      }

      .container {
        max-width: 390px;
      }

      .link-card {
        min-height: 62px;
        border-radius: 15px;
      }
    }

    /* =========================
       REDUCED MOTION
    ========================= */

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }

      .link-card {
        opacity: 1;
        transform: none;
      }
    }
  </style>

</head>

<body>

  </main>
