<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Musa (@musaisapaki) • Link Tree</title>

  <meta name="theme-color" content="#08080b">
  <meta name="description" content="Official links and social profiles for Musa (@musaisapaki)">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Font Awesome Icons CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Inter Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            brand: {
              instagram: '#E1306C',
              tiktok: '#00f2fe',
              snapchat: '#FFFC00',
              youtube: '#FF0000',
              spotify: '#1DB954',
              twitch: '#9146FF'
            }
          },
          animation: {
            'spin-slow': 'spin 8s linear infinite',
            'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'float': 'float 6s ease-in-out infinite',
          },
          keyframes: {
            float: {
              '0%, 100%': { transform: 'translateY(0px)' },
              '50%': { transform: 'translateY(-10px)' },
            }
          }
        }
      }
    }
  </script>

  <style>
    :root {
      --bg: #07070a;
      --card-bg: rgba(255, 255, 255, 0.035);
      --card-border: rgba(255, 255, 255, 0.08);
      --text: #ffffff;
      --muted: #a1a1aa;
      --accent-pink: #6366f1;
      --accent-purple: #4c1d95;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
    }

    /* Ambient Cursor Glow */
    #cursor-glow {
      position: fixed;
      width: 450px;
      height: 450px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.12) 0%, rgba(76, 29, 149, 0.06) 40%, rgba(0, 0, 0, 0) 70%);
      pointer-events: none;
      transform: translate(-50%, -50%);
      transition: width 0.3s, height 0.3s, opacity 0.3s;
      z-index: 1;
    }

    /* Glassmorphism Cards */
    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
    }

    .glass-pill {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* Avatar Conic Ring */
    .avatar-ring {
      background: conic-gradient(
        from 0deg,
        #4f46e5,
        #312e81,
        #1e1b4b,
        #4f46e5
      );
    }

    /* Shine effect for links */
    .shine-effect {
      position: relative;
      overflow: hidden;
    }

    .shine-effect::before {
      content: '';
      position: absolute;
      top: 0;
      left: -150%;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 255, 255, 0.12),
        transparent
      );
      transform: skewX(-25deg);
      transition: left 0.75s ease;
    }

    .shine-effect:hover::before {
      left: 150%;
    }

    /* Link Hover Styles with Platform Colors */
    .link-card {
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      transform-style: preserve-3d;
      perspective: 1000px;
    }

    .link-card[data-platform="instagram"]:hover {
      border-color: rgba(225, 48, 108, 0.5);
      box-shadow: 0 10px 30px -5px rgba(225, 48, 108, 0.25);
      background: linear-gradient(135deg, rgba(225, 48, 108, 0.12) 0%, rgba(255, 255, 255, 0.03) 100%);
    }

    .link-card[data-platform="tiktok"]:hover {
      border-color: rgba(0, 242, 254, 0.5);
      box-shadow: 0 10px 30px -5px rgba(0, 242, 254, 0.2);
      background: linear-gradient(135deg, rgba(0, 242, 254, 0.1) 0%, rgba(255, 0, 80, 0.08) 100%);
    }

    .link-card[data-platform="snapchat"]:hover {
      border-color: rgba(255, 252, 0, 0.5);
      box-shadow: 0 10px 30px -5px rgba(255, 252, 0, 0.2);
      background: linear-gradient(135deg, rgba(255, 252, 0, 0.1) 0%, rgba(255, 255, 255, 0.03) 100%);
    }

    .link-card[data-platform="youtube"]:hover {
      border-color: rgba(255, 0, 0, 0.5);
      box-shadow: 0 10px 30px -5px rgba(255, 0, 0, 0.25);
      background: linear-gradient(135deg, rgba(255, 0, 0, 0.12) 0%, rgba(255, 255, 255, 0.03) 100%);
    }

    .link-card[data-platform="spotify"]:hover {
      border-color: rgba(29, 185, 84, 0.5);
      box-shadow: 0 10px 30px -5px rgba(29, 185, 84, 0.25);
      background: linear-gradient(135deg, rgba(29, 185, 84, 0.12) 0%, rgba(255, 255, 255, 0.03) 100%);
    }

    /* Keyframes for Toast Notification */
    @keyframes toastIn {
      from { transform: translateY(100%) scale(0.9); opacity: 0; }
      to { transform: translateY(0) scale(1); opacity: 1; }
    }

    @keyframes toastOut {
      from { transform: translateY(0) scale(1); opacity: 1; }
      to { transform: translateY(100%) scale(0.9); opacity: 0; }
    }

    .toast-enter {
      animation: toastIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .toast-exit {
      animation: toastOut 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>

<body class="min-h-screen flex flex-col justify-between items-center py-10 px-4 relative select-none">

  <!-- Interactive Canvas Background for Particles -->
  <canvas id="particle-canvas" class="fixed inset-0 pointer-events-none z-0"></canvas>

  <!-- Ambient Cursor Glow -->
  <div id="cursor-glow"></div>

  <!-- Background Gradient Orbs -->
  <div class="fixed top-0 left-1/2 -translate-x-1/2 w-[600px] h-[350px] bg-gradient-to-b from-indigo-950/20 via-slate-900/10 to-transparent blur-[120px] pointer-events-none z-0"></div>

  <!-- Main Container -->
  <main class="w-full max-w-[420px] flex flex-col items-center relative z-10 my-auto">

    <!-- Profile Header Card -->
    <header class="w-full text-center flex flex-col items-center mb-8">
      <!-- Profile Avatar Container -->
      <div class="relative mb-4 group cursor-pointer" id="avatar-container">
        <!-- Rotating Animated Ring -->
        <div class="w-[108px] h-[108px] rounded-full avatar-ring animate-spin-slow p-[2px] shadow-[0_0_25px_rgba(79,70,229,0.25)]">
          <div class="w-full h-full bg-[#07070a] rounded-full"></div>
        </div>

        <!-- Main Avatar Image / Initials -->
        <div class="absolute inset-[6px] rounded-full bg-gradient-to-br from-zinc-900 via-zinc-950 to-black flex items-center justify-center border border-white/10 shadow-inner overflow-hidden group-hover:scale-105 transition-transform duration-300">
          <span class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-indigo-300 via-slate-300 to-indigo-500">
            M
          </span>
        </div>

        <!-- Online Indicator Dot -->
        <div class="absolute bottom-1 right-1 w-5 h-5 rounded-full bg-emerald-600 border-4 border-[#07070a] shadow-[0_0_10px_rgba(5,150,105,0.6)] z-20"></div>
      </div>

      <!-- User Information -->
      <h1 class="text-2xl font-extrabold tracking-tight text-white mb-1">
        Musa
      </h1>

      <!-- Simple Text Handle -->
      <p class="text-sm font-medium text-zinc-400">@musaisapaki</p>
    </header>

    <!-- Social Links Grid / List -->
    <section class="w-full flex flex-col gap-3.5" id="links-container">

      <!-- Instagram Link -->
      <a href="https://www.instagram.com/musaisapaki/" target="_blank" rel="noopener noreferrer" 
         data-platform="instagram"
         class="link-card shine-effect glass-card w-full h-[64px] rounded-2xl px-4 flex items-center justify-between group cursor-pointer border border-white/10">
        <div class="flex items-center gap-3.5">
          <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-amber-500 via-rose-500 to-purple-600 flex items-center justify-center text-white shadow-md group-hover:scale-110 transition-transform duration-300">
            <i class="fa-brands fa-instagram text-xl"></i>
          </div>
          <span class="text-sm font-semibold text-zinc-100 group-hover:text-white transition-colors">Instagram</span>
        </div>
        <div class="w-8 h-8 rounded-full flex items-center justify-center text-zinc-500 group-hover:text-pink-400 group-hover:translate-x-1 group-hover:-translate-y-0.5 transition-all duration-300">
          <i class="fa-solid fa-arrow-up-right-from-square text-xs"></i>
        </div>
      </a>

      <!-- TikTok Link -->
      <a href="https://www.tiktok.com/@musaisapaki" target="_blank" rel="noopener noreferrer" 
         data-platform="tiktok"
         class="link-card shine-effect glass-card w-full h-[64px] rounded-2xl px-4 flex items-center justify-between group cursor-pointer border border-white/10">
        <div class="flex items-center gap-3.5">
          <div class="w-10 h-10 rounded-xl bg-black border border-white/15 flex items-center justify-center text-white shadow-md group-hover:scale-110 transition-transform duration-300">
            <i class="fa-brands fa-tiktok text-xl text-cyan-400 drop-shadow-[2px_0_0_rgba(255,0,80,0.8)]"></i>
          </div>
          <span class="text-sm font-semibold text-zinc-100 group-hover:text-white transition-colors">TikTok</span>
        </div>
        <div class="w-8 h-8 rounded-full flex items-center justify-center text-zinc-500 group-hover:text-cyan-400 group-hover:translate-x-1 group-hover:-translate-y-0.5 transition-all duration-300">
          <i class="fa-solid fa-arrow-up-right-from-square text-xs"></i>
        </div>
      </a>

      <!-- Snapchat Link -->
      <a href="https://www.snapchat.com/add/musaisapaki?share_id=CIl9aGCcRcupm5jEYggMNw&locale=en_CA" target="_blank" rel="noopener noreferrer" 
         data-platform="snapchat"
         class="link-card shine-effect glass-card w-full h-[64px] rounded-2xl px-4 flex items-center justify-between group cursor-pointer border border-white/10">
        <div class="flex items-center gap-3.5">
          <div class="w-10 h-10 rounded-xl bg-yellow-400 flex items-center justify-center text-black shadow-md group-hover:scale-110 transition-transform duration-300">
            <i class="fa-brands fa-snapchat text-2xl"></i>
          </div>
          <span class="text-sm font-semibold text-zinc-100 group-hover:text-white transition-colors">Snapchat</span>
        </div>
        <div class="w-8 h-8 rounded-full flex items-center justify-center text-zinc-500 group-hover:text-yellow-400 group-hover:translate-x-1 group-hover:-translate-y-0.5 transition-all duration-300">
          <i class="fa-solid fa-arrow-up-right-from-square text-xs"></i>
        </div>
      </a>

      <!-- YouTube Link -->
      <a href="https://www.youtube.com/@musaisapaki" target="_blank" rel="noopener noreferrer" 
         data-platform="youtube"
         class="link-card shine-effect glass-card w-full h-[64px] rounded-2xl px-4 flex items-center justify-between group cursor-pointer border border-white/10">
        <div class="flex items-center gap-3.5">
          <div class="w-10 h-10 rounded-xl bg-red-600 flex items-center justify-center text-white shadow-md group-hover:scale-110 transition-transform duration-300">
            <i class="fa-brands fa-youtube text-xl"></i>
          </div>
          <span class="text-sm font-semibold text-zinc-100 group-hover:text-white transition-colors">YouTube</span>
        </div>
        <div class="w-8 h-8 rounded-full flex items-center justify-center text-zinc-500 group-hover:text-red-500 group-hover:translate-x-1 group-hover:-translate-y-0.5 transition-all duration-300">
          <i class="fa-solid fa-arrow-up-right-from-square text-xs"></i>
        </div>
      </a>

    </section>

    <!-- Featured / Latest Video Section -->
    <section class="w-full mt-6 flex flex-col gap-3">
      <div class="flex items-center justify-between px-1">
        <span class="text-xs font-bold uppercase tracking-wider text-zinc-400 flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></span>
          Latest Video
        </span>
        <a href="https://www.youtube.com/@musaisapaki" target="_blank" class="text-xs text-zinc-400 hover:text-red-400 transition-colors flex items-center gap-1 font-medium">
          Watch on YouTube <i class="fa-solid fa-chevron-right text-[10px]"></i>
        </a>
      </div>

      <!-- Responsive Video Player Card -->
      <div class="glass-card w-full rounded-2xl p-2.5 border border-white/10 group hover:border-red-500/40 hover:shadow-[0_10px_30px_-5px_rgba(255,0,0,0.2)] transition-all duration-300">
        <div class="relative w-full aspect-video rounded-xl overflow-hidden bg-black/60 shadow-inner">
          <iframe 
            class="w-full h-full rounded-xl"
            src="https://www.youtube-nocookie.com/embed?listType=user_uploads&list=musaisapaki" 
            title="Musa's Latest YouTube Video"
            frameborder="0" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
            allowfullscreen>
          </iframe>
        </div>
      </div>
    </section>

    <!-- Footer -->
    <footer class="mt-10 text-center flex flex-col items-center gap-2">
      <div class="flex items-center gap-3 text-zinc-500 text-sm">
        <a href="https://www.instagram.com/musaisapaki/" target="_blank" class="hover:text-pink-400 transition-colors"><i class="fa-brands fa-instagram"></i></a>
        <a href="https://www.tiktok.com/@musaisapaki" target="_blank" class="hover:text-cyan-400 transition-colors"><i class="fa-brands fa-tiktok"></i></a>
        <a href="https://www.youtube.com/@musaisapaki" target="_blank" class="hover:text-red-500 transition-colors"><i class="fa-brands fa-youtube"></i></a>
      </div>
      <p class="text-[11px] text-zinc-600 font-medium">
        © <span id="year"></span> Musa • All Rights Reserved
      </p>
    </footer>

  </main>

  <!-- Toast Notification -->
  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 glass-card border border-pink-500/30 text-white text-xs font-medium px-4 py-2.5 rounded-full flex items-center gap-2 shadow-2xl z-50 pointer-events-none opacity-0">
    <i class="fa-solid fa-circle-check text-pink-400 text-sm"></i>
    <span id="toast-message">Copied to clipboard!</span>
  </div>

  <script>
    // Initialize Current Year
    document.getElementById('year').textContent = new Date().getFullYear();

    // Ambient Cursor Glow Follower
    const cursorGlow = document.getElementById('cursor-glow');
    let mouseX = window.innerWidth / 2;
    let mouseY = window.innerHeight / 2;
    let glowX = mouseX;
    let glowY = mouseY;

    window.addEventListener('mousemove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
    });

    // Touch support for mobile glow
    window.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) {
        mouseX = e.touches[0].clientX;
        mouseY = e.touches[0].clientY;
      }
    });

    function animateGlow() {
      glowX += (mouseX - glowX) * 0.08;
      glowY += (mouseY - glowY) * 0.08;
      cursorGlow.style.left = `${glowX}px`;
      cursorGlow.style.top = `${glowY}px`;
      requestAnimationFrame(animateGlow);
    }
    animateGlow();

    // Canvas Floating Particles Background
    const canvas = document.getElementById('particle-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor() {
        this.reset();
      }

      reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 1.8 + 0.5;
        this.vx = (Math.random() - 0.5) * 0.3;
        this.vy = (Math.random() - 0.5) * 0.3;
        this.alpha = Math.random() * 0.5 + 0.1;
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;

        if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
          this.reset();
        }
      }

      draw() {
        ctx.fillStyle = `rgba(99, 102, 241, ${this.alpha})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // Populate particles
    for (let i = 0; i < 45; i++) {
      particles.push(new Particle());
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.update();
        p.draw();
      });
      requestAnimationFrame(animateParticles);
    }
    animateParticles();

    // 3D Card Tilt Effect on Hover
    const linkCards = document.querySelectorAll('.link-card');
    linkCards.forEach(card => {
      card.addEventListener('mousemove', (e) => {
        const rect = card.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const centerX = rect.width / 2;
        const centerY = rect.height / 2;
        const rotateX = (y - centerY) / 12;
        const rotateY = (centerX - x) / 12;

        card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.02, 1.02, 1.02)`;
      });

      card.addEventListener('mouseleave', () => {
        card.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)';
      });
    });
  </script>
</body>
</html>
