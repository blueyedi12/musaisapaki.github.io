<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>@musaisapaki | Links</title>
  <style>
    :root {
      --bg: #09090b;
      --card-bg: #18181b;
      --card-hover: #27272a;
      --text: #f4f4f5;
      --subtext: #a1a1aa;
      --border: #27272a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    .profile-img {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: var(--card-bg);
      border: 2px solid var(--border);
      margin: 0 auto 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 1.5rem;
      color: var(--subtext);
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 4px;
      letter-spacing: -0.02em;
    }

    p.handle {
      color: var(--subtext);
      font-size: 0.9rem;
      margin-bottom: 32px;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .link-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      text-decoration: none;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .link-card:hover {
      background-color: var(--card-hover);
      transform: translateY(-2px);
    }

    .link-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .link-info svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .arrow {
      color: var(--subtext);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

    <!-- Minimalist Monogram Avatar -->
    <div class="profile-img">M</div>
